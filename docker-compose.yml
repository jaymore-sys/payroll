# Local development database (MariaDB, like Hostinger). DATABASE_URL=mysql://payroll:payroll@127.0.0.1:3306/payrollpro
services:
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_USER: payroll
      MARIADB_PASSWORD: payroll
      MARIADB_DATABASE: payrollpro
      MARIADB_ROOT_PASSWORD: payroll-root
    ports: ["127.0.0.1:3306:3306"]   # bound to localhost only
    volumes: [dbdata:/var/lib/mysql]
volumes:
  dbdata:
